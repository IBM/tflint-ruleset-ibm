# Release configuration. See https://goreleaser.com
version: 2
env:
  - CGO_ENABLED=0
builds:
  - flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/IBM/tflint-ruleset-ibm/project.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_386
      - linux_amd64
      - linux_arm
      - linux_arm64
      - windows_386
      - windows_amd64
    hooks:
      post:
        - mkdir -p ./dist/raw
        - cp "{{ .Path }}" "./dist/raw/{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
archives:
  - id: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    files:
      - none*
checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./dist/raw/*
signs:
  # TFLint verifies checksums.txt.sig against the signing_key in .tflint.hcl.
  - artifacts: checksum
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --passphrase
      - "{{ .Env.GPG_PASSPHRASE }}"
      - -u
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"
sboms:
  - artifacts: archive
release:
  github:
    owner: IBM
    name: tflint-ruleset-ibm
  draft: true
snapshot:
  version_template: "{{ .Tag }}-dev"
